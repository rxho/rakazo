# Streaming speech recognition for Rakazo calls.
#
# Serves the two-pass WebSocket protocol (JSON control frames + raw PCM chunks)
# that Rakazo's self-hosted voice connection speaks. Run on the GPU host, then
# paste `ws://<host>:10095` into Rakazo: Settings → Voice → Self-hosted →
# Streaming recognition address.
#
# The CPU image transcribes a conversation with ease; switch to the GPU image
# (and add the deploy block below) when the same card also runs TTS and you
# want the extra headroom.

services:
  funasr:
    image: registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.13
    container_name: funasr-server
    restart: unless-stopped
    # The image's default CMD is a bare bash, and the bundled launcher
    # backgrounds the server and exits (killing it when the container's main
    # process ends). Run the server binary itself in the foreground, with TLS
    # off (the relay speaks plain ws://). First start downloads the models
    # from ModelScope into ./funasr-resources.
    # The arg parser wants space-separated "--flag value", not "--flag=value".
    command:
      - /workspace/FunASR/runtime/websocket/build/bin/funasr-wss-server-2pass
      - --download-model-dir
      - /workspace/models
      - --model-dir
      - damo/speech_paraformer-large-vad-punc_asr_nat-zh-cn-16k-common-vocab8404-onnx
      - --online-model-dir
      - damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx
      - --vad-dir
      - damo/speech_fsmn_vad_zh-cn-16k-common-onnx
      - --punc-dir
      - damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx
      - --itn-dir
      - thuduj12/fst_itn_zh
      - --lm-dir
      - damo/speech_ngram_lm_zh-cn-ai-wesp-fst
      - --decoder-thread-num
      - "8"
      - --model-thread-num
      - "1"
      - --io-thread-num
      - "1"
      - --port
      - "10095"
      - --certfile
      - ""
      - --keyfile
      - ""
      - --hotword
      - /workspace/FunASR/runtime/websocket/hotwords.txt
    ports:
      - "10095:10095"
      - "10096:10096"
    volumes:
      # Downloaded models survive restarts.
      - ./funasr-resources:/workspace/models
