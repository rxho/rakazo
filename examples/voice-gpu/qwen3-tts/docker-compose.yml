# Qwen3-TTS as an OpenAI-compatible speech server.
#
# Run on the GPU host, then paste `http://<host>:8810/v1` into Rakazo:
# Settings → Voice → Provider: Self-hosted → Server URL. Speech model can
# stay empty; voices come from /v1/audio/voices (vivian, serena, uncle_fu, ...).

services:
  qwen3-tts:
    build: .
    container_name: qwen3-tts
    restart: unless-stopped
    ports:
      - "8810:8810"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      TTS_MODEL: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
      TTS_DTYPE: float32
      # Model downloads go through a mirror close to the host; unset to use Hugging Face directly.
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
